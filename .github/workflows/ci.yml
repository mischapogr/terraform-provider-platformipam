name: Provider CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/provider-go-mod
            ${{ runner.temp }}/provider-go-build
          key: ${{ runner.os }}-provider-go-1.26.9-${{ hashFiles('go.sum') }}
      - name: Provider format, tests and build with pinned Go
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/provider-go-mod" "$RUNNER_TEMP/provider-go-build"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/provider-go-mod:/go/pkg/mod" \
            -v "$RUNNER_TEMP/provider-go-build:/go-build" \
            -w /src -e GOCACHE=/go-build -e CGO_ENABLED=0 -e TF_ACC= \
            golang:1.26.9-bookworm sh -ec '
              test -z "$(gofmt -l .)"
              go test -mod=readonly ./...
              go build -mod=readonly -buildvcs=false -trimpath -o /tmp/terraform-provider-platformipam .
            '
      - name: Portable plan guard syntax
        run: python3 -B -m py_compile scripts/check-replacement-plan.py
