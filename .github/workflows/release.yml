name: Provider release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: Prepare semantic version release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Prepare provider release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          target-branch: main
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          # Signed packages are published by the tag job after qualification.
          skip-github-release: true

  release:
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    uses: mischapogr/platform-ipam/.github/workflows/terraform-provider-release.yml@a88cc5c7f9b718abbb55a9cdef69708acd875326
    with:
      source-ref: a88cc5c7f9b718abbb55a9cdef69708acd875326
      signing-key-fingerprint: F1EAE2D8ED6BF46AEEE8889E136F9D1E6B3B2BE8
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
